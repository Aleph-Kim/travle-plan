name: weather

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  # 배포(main 푸시) 때마다 날씨도 갱신. 이 작업이 GITHUB_TOKEN 으로 올린 커밋은 푸시 이벤트를 다시 만들지 않아 반복되지 않음
  push:
    branches: [main]
    paths-ignore:
      - data/weather.json

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: weather-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/weather.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather.json
          git diff --cached --quiet || (git commit -m "날씨 갱신" && git pull --rebase && git push)

  # GitHub 예약 실행은 몇 시간씩 건너뛰는 일이 잦아서, 실행이 끝나면 1시간 뒤 다음 실행을 직접 요청함
  # 새 실행이 시작되면 이전 대기 작업은 취소되어 대기는 항상 하나만 남음.
  # 여행 마지막 날(plan.json의 마지막 날짜, 현지 시간대 기준)이 지나면 멈춤
  next:
    needs: update
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 70
    concurrency:
      group: weather-next
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: data/plan.json
          sparse-checkout-cone-mode: false
      - run: sleep 3540
      - name: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TRIP_TZ=$(jq -r '.trip.timezone' data/plan.json)
          LAST_DAY=$(jq -r '.days[-1].date | gsub("-"; "")' data/plan.json)
          if [ "$(TZ=$TRIP_TZ date +%Y%m%d)" -le "$LAST_DAY" ]; then
            gh workflow run weather.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi
