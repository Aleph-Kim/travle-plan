name: weather

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  # 배포(main 푸시) 때마다 날씨도 갱신. 이 작업이 GITHUB_TOKEN 으로 올린 커밋은 푸시 이벤트를 다시 만들지 않아 반복되지 않음
  push:
    branches: [main]
    paths-ignore:
      - data/*/weather.json

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: weather-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/weather.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*/weather.json
          git diff --cached --quiet || (git commit -m "날씨 갱신" && git pull --rebase && git push)

  # GitHub 예약 실행은 몇 시간씩 건너뛰는 일이 잦아서, 실행이 끝나면 1시간 뒤 다음 실행을 직접 요청함
  # 새 실행이 시작되면 이전 대기 작업은 취소되어 대기는 항상 하나만 남음.
  # 예보를 받을 여행(trips.json 중 오늘부터 16일 안에 걸치는 여행, 현지 시간대 기준)이 없으면 멈춤.
  # 멈춘 뒤에도 예약 실행이 이 작업을 다시 부르므로, 새 여행이 예보 범위에 들어오면 다시 이어짐
  next:
    needs: update
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 70
    concurrency:
      group: weather-next
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data/trips.json
            data/*/plan.json
          sparse-checkout-cone-mode: false
      - run: sleep 3540
      - name: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for SLUG in $(jq -r '.[].slug' data/trips.json); do
            TRIP_TZ=$(jq -r '.trip.timezone' "data/$SLUG/plan.json")
            FIRST_DAY=$(jq -r '.days[0].date | gsub("-"; "")' "data/$SLUG/plan.json")
            LAST_DAY=$(jq -r '.days[-1].date | gsub("-"; "")' "data/$SLUG/plan.json")
            if [ "$(TZ=$TRIP_TZ date +%Y%m%d)" -le "$LAST_DAY" ] && [ "$(TZ=$TRIP_TZ date -d '+15 days' +%Y%m%d)" -ge "$FIRST_DAY" ]; then
              gh workflow run weather.yml --repo "$GITHUB_REPOSITORY" --ref main
              break
            fi
          done
