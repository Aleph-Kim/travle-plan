name: weather

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  # 배포(main 푸시) 때마다 날씨도 갱신. 이 작업이 GITHUB_TOKEN 으로 올린 커밋은 푸시 이벤트를 다시 만들지 않아 반복되지 않음
  push:
    branches: [main]
    paths-ignore:
      - data/weather.json

permissions:
  contents: write

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/weather.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather.json
          git diff --cached --quiet || (git commit -m "날씨 갱신" && git pull --rebase && git push)
