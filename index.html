<!doctype html>
<html lang="ko" class="motion">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>히로시마 동선</title>
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preload" href="data/plan.json" as="fetch" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #f5f5f7;
  --card: #ffffff;
  --fill: rgba(118, 118, 128, .12);
  --ink: #1d1d1f;
  --ink2: #6e6e73;
  --ink3: #86868b;
  --sep: rgba(60, 60, 67, .16);
  --blue: #0071e3;
  --green: #34c759;
  --orange: #ff9f0a;
  --red: #ff3b30;
  --indigo: #5856d6;
  --bar: rgba(245, 245, 247, .72);
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 8px 24px rgba(0, 0, 0, .06);
  --outer: #e8e8ed;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --spring: cubic-bezier(.32, .72, 0, 1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --card: #1c1c1e;
    --fill: rgba(118, 118, 128, .24);
    --ink: #f5f5f7;
    --ink2: #a1a1a6;
    --ink3: #86868b;
    --sep: rgba(84, 84, 88, .55);
    --blue: #2997ff;
    --green: #30d158;
    --orange: #ff9f0a;
    --red: #ff453a;
    --indigo: #7d7aff;
    --bar: rgba(22, 22, 23, .72);
    --shadow: none;
    --outer: #0b0b0c;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--outer); }
body {
  margin: 0 auto; max-width: 430px; min-height: 100vh; background: var(--bg); color: var(--ink);
  font: 16px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  padding-bottom: env(safe-area-inset-bottom);
}
button { font: inherit; color: inherit; }
a { color: var(--blue); text-decoration: none; }

.hero { padding: 54px 20px 6px; display: flex; align-items: flex-end; justify-content: space-between; }
.hero h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
.hero p { margin: 4px 0 0; color: var(--ink2); font-size: 15px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--fill);
  display: grid; place-items: center; cursor: pointer; flex: 0 0 auto;
}
.icon-btn svg { width: 19px; height: 19px; }
.offline { margin: 8px 20px 0; font-size: 13px; color: var(--orange); }

.group { margin: 14px 16px 0; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.row { display: grid; grid-template-columns: 72px 1fr; gap: 0 12px; padding: 11px 16px; align-items: center; }
.row + .row { border-top: .5px solid var(--sep); }
.row .k { font-size: 13px; color: var(--ink2); line-height: 1.3; }
.row .k b { display: block; color: var(--ink); font-size: 15px; font-weight: 600; }
.leg { font-size: 15px; font-variant-numeric: tabular-nums; }
.leg span { color: var(--ink3); font-size: 13px; display: inline-block; width: 32px; }

.bar {
  position: sticky; top: 0; z-index: 5; margin-top: 14px; padding: 8px 16px 10px;
  background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: .5px solid transparent; transition: border-color .3s;
}
.bar.stuck { border-bottom-color: var(--sep); }
.bar-title { height: 0; overflow: hidden; text-align: center; font-weight: 600; font-size: 15px; opacity: 0; transition: opacity .25s, height .25s var(--ease); }
.bar.stuck .bar-title { height: 22px; opacity: 1; margin-bottom: 6px; }
.seg { position: relative; display: flex; background: var(--fill); border-radius: 10px; padding: 2px; }
.seg button {
  position: relative; z-index: 1; flex: 1; border: 0; background: none; padding: 7px 0; font-size: 13px; font-weight: 500;
  border-radius: 8px; cursor: pointer; color: var(--ink);
}
.seg button[aria-selected="true"] { font-weight: 600; }
.seg-pill {
  position: absolute; top: 2px; bottom: 2px; left: 0; border-radius: 8px; background: var(--card);
  box-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 3px 1px rgba(0, 0, 0, .04);
}
.motion .seg-pill { transition: transform .45s var(--spring), width .45s var(--spring); }
@media (prefers-color-scheme: dark) { .seg-pill { background: #636366; } }

#day { padding: 0 16px; }
.day-hero { padding: 22px 4px 4px; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--ink2); }
.day-hero h2 { margin: 2px 0 0; font-size: 30px; line-height: 1.15; letter-spacing: -0.03em; }
.day-hero .point { display: inline-block; margin-top: 8px; padding: 3px 10px; border-radius: 999px; background: var(--fill); font-size: 13px; font-weight: 600; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.stat { background: var(--card); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); }
.stat .l { font-size: 12px; color: var(--ink2); }
.stat .v { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 13px; font-weight: 600; color: var(--ink2); margin-left: 2px; }
.stat .v.txt { font-size: 17px; padding-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .s { font-size: 12px; color: var(--ink3); }

.notice { margin-top: 12px; border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; font-size: 14px; }
.notice svg { flex: 0 0 20px; height: 20px; margin-top: 1px; }
.notice b { display: block; margin-bottom: 2px; }
.notice.towel { background: rgba(255, 159, 10, .14); }
.notice.towel svg { color: var(--orange); }
.notice.rain { background: rgba(0, 113, 227, .1); }
.notice.rain svg { color: var(--blue); }
.notice ul { margin: 4px 0 0; padding-left: 18px; }

.wx { margin-top: 12px; background: var(--card); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); }
.wx-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.wx-cond { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.wx-pop { font-weight: 700; color: var(--blue); white-space: nowrap; }
.wx-meta { font-size: 13px; color: var(--ink2); margin-top: 2px; }

.sec { margin: 26px 4px 10px; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }

.tl { position: relative; list-style: none; margin: 0; padding: 0 0 0 22px; }
.tl::before { content: ""; position: absolute; left: 6px; top: 8px; bottom: 8px; width: 2px; border-radius: 1px; background: var(--sep); }
.it { position: relative; margin-bottom: 12px; scroll-margin-top: 110px; }
.dot { position: absolute; left: -22px; top: 18px; width: 14px; height: 14px; border-radius: 50%; background: var(--card); border: 3px solid var(--ink3); }
.it.now .dot { border-color: var(--green); background: var(--green); }
.motion .it.now .dot::after {
  content: ""; position: absolute; inset: -6px; border-radius: 50%; background: var(--green); opacity: .35;
  animation: pulse 2s var(--ease) infinite;
}
@keyframes pulse { 0% { transform: scale(.6); opacity: .45; } 100% { transform: scale(1.8); opacity: 0; } }
.it.past { opacity: .5; }
.card { background: var(--card); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); }
.it.now .card { box-shadow: 0 0 0 2px var(--green), var(--shadow); }
.it-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.time { font-size: 13px; font-weight: 600; color: var(--ink2); font-variant-numeric: tabular-nums; }
.now-chip { font-size: 11px; font-weight: 700; color: #fff; background: var(--green); border-radius: 999px; padding: 1px 7px; margin-left: 6px; }
.cost { font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.title { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; margin-top: 2px; }
.rec { font-size: 11px; font-weight: 700; color: var(--indigo); background: rgba(88, 86, 214, .12); border-radius: 5px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }
.move .card { background: transparent; box-shadow: none; padding: 6px 4px; }
.move .dot { width: 10px; height: 10px; left: -20px; top: 12px; border-width: 2px; }
.move .title { font-size: 15px; font-weight: 500; }
.note { font-size: 14px; color: var(--ink2); margin-top: 4px; }
.note div + div, .tip div + div { margin-top: 2px; }
.tip { font-size: 14px; color: var(--ink2); margin-top: 8px; padding-left: 10px; border-left: 2px solid var(--orange); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.pill { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 2px 7px; background: var(--fill); font-variant-numeric: tabular-nums; }
.pill small { font-weight: 500; color: var(--ink2); margin-left: 3px; }
.pill.g { color: var(--blue); }
.pill.t { color: var(--orange); }

.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: 32px; padding: 0 14px;
  border-radius: 999px; border: 0; background: var(--fill); color: var(--blue); font-size: 14px; font-weight: 600; cursor: pointer;
}
.btn.fill { background: var(--blue); color: #fff; }
.motion .btn, .motion .icon-btn, .motion .opt-pick { transition: transform .15s var(--ease), opacity .15s; }
.motion .btn:active, .motion .icon-btn:active, .motion .opt-pick:active { transform: scale(.96); opacity: .8; }
.btn:disabled { opacity: .5; }

.disc { margin-top: 10px; }
.disc-btn { border: 0; background: none; padding: 0; color: var(--blue); font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.disc-btn svg { width: 12px; height: 12px; }
.motion .disc-btn svg { transition: transform .3s var(--ease); }
.disc.open .disc-btn svg { transform: rotate(90deg); }
.disc-body { display: grid; grid-template-rows: 0fr; }
.motion .disc-body { transition: grid-template-rows .35s var(--ease); }
.disc.open .disc-body { grid-template-rows: 1fr; }
.disc-body > div { overflow: hidden; }
.rv-list { margin: 4px 0 0; padding: 0; list-style: none; font-size: 14px; }
.rv-list li { position: relative; padding-left: 18px; margin-top: 4px; }
.rv-list li::before { position: absolute; left: 0; top: 0; font-weight: 700; }
.rv-list.pro li::before { content: "+"; color: var(--green); }
.rv-list.con li::before { content: "\2212"; color: var(--red); }
.rv-cap { font-size: 12px; font-weight: 600; color: var(--ink2); margin-top: 10px; }

.choice-tag { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; color: var(--blue); margin-top: 2px; }
.choice-hint { font-size: 12px; color: var(--ink3); font-weight: 500; }
.opts { display: grid; gap: 8px; margin-top: 10px; }
.opt { border-radius: 12px; background: var(--bg); padding: 12px; border: 1.5px solid transparent; }
.motion .opt { transition: border-color .25s, background .25s, opacity .25s; }
.opt.on { border-color: var(--blue); background: rgba(0, 113, 227, .06); }
.opts.picked:not(.multi) .opt:not(.on) { opacity: .55; }
.opt-pick { all: unset; display: flex; align-items: center; gap: 10px; cursor: pointer; width: 100%; }
.chk { flex: 0 0 22px; height: 22px; }
.chk circle { fill: none; stroke: var(--ink3); stroke-width: 1.5; }
.chk path { fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 14; stroke-dashoffset: 14; }
.on .chk circle { fill: var(--blue); stroke: var(--blue); }
.on .chk path { stroke-dashoffset: 0; }
.motion .chk circle { transition: fill .2s, stroke .2s; }
.motion .chk path { transition: stroke-dashoffset .3s .08s var(--ease); }
.opt .title { font-size: 16px; margin: 0; }

.motion .rv { opacity: 0; transform: translateY(18px) scale(.985); transition: opacity .7s var(--ease), transform .7s var(--ease); }
.motion .rv.in { opacity: 1; transform: none; }

#extras { padding: 0 16px 120px; }
.ex { background: var(--card); border-radius: 14px; margin-bottom: 10px; box-shadow: var(--shadow); overflow: hidden; }
.ex > summary { list-style: none; cursor: pointer; padding: 14px 16px; font-weight: 600; display: flex; justify-content: space-between; }
.ex > summary::-webkit-details-marker { display: none; }
.ex > summary span { color: var(--ink3); font-weight: 500; }
.ex .card { box-shadow: none; border-radius: 0; border-top: .5px solid var(--sep); }
.foot { font-size: 12px; color: var(--ink3); margin: 16px 4px 0; }

#nowcap {
  position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 8; width: calc(min(430px, 100vw) - 32px);
  transform: translate(-50%, 160%); border: 0; border-radius: 18px; padding: 10px 14px; text-align: left; cursor: pointer;
  background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .18); display: grid; grid-template-columns: 1fr auto; gap: 0 10px; align-items: center;
}
.motion #nowcap { transition: transform .5s var(--spring); }
#nowcap.show { transform: translate(-50%, 0); }
#nowcap .a { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#nowcap .b { font-size: 13px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#nowcap .go { grid-row: span 2; grid-column: 2; color: var(--blue); font-weight: 600; font-size: 14px; }

.sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; visibility: hidden; }
.sheet.open { visibility: visible; }
.scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .4); opacity: 0; }
.panel {
  position: relative; width: 100%; max-width: 430px; background: var(--bg); border-radius: 14px 14px 0 0;
  transform: translateY(100%); display: flex; flex-direction: column; max-height: 92vh;
}
.motion .sheet { transition: visibility 0s .5s; }
.motion .sheet.open { transition: visibility 0s; }
.motion .scrim { transition: opacity .4s var(--ease); }
.motion .panel { transition: transform .5s var(--spring); }
.sheet.open .scrim { opacity: 1; }
.sheet.open .panel { transform: none; }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--ink3); opacity: .5; margin: 6px auto 0; }
.panel-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; }
.panel-head b { font-size: 17px; }
#map-frame { height: 74vh; }
#map-frame iframe { display: block; width: 100%; height: 100%; border: 0; }
.set { margin: 4px 16px 24px; background: var(--card); border-radius: 12px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; }
.set-row small { display: block; color: var(--ink2); font-size: 13px; }
.switch { position: relative; width: 51px; height: 31px; flex: 0 0 51px; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 16px; background: var(--fill); transition: background .25s; }
.switch span::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff;
  box-shadow: 0 3px 8px rgba(0, 0, 0, .15); transition: transform .3s var(--spring);
}
.switch input:checked + span { background: var(--green); }
.switch input:checked + span::after { transform: translateX(20px); }
.err { color: var(--red); font-size: 13px; margin-top: 8px; }
.rain-desc { margin: 0 16px 10px; font-size: 14px; color: var(--ink2); }
#rain-body { padding: 0 16px 28px; display: grid; gap: 8px; }
.rain-day { all: unset; cursor: pointer; display: block; background: var(--card); border-radius: 12px; padding: 12px 14px; }
.rain-day b { display: block; font-size: 16px; }
.rain-day span { font-size: 14px; color: var(--ink2); }
@media (prefers-reduced-motion: reduce) { html.motion * { animation: none !important; } }
</style>
</head>
<body>
<header class="hero">
  <div>
    <h1>히로시마</h1>
    <p>10월 15일 ~ 19일</p>
  </div>
  <button class="icon-btn" id="open-set" type="button" aria-label="설정">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
  </button>
</header>
<div class="offline" id="net" hidden>오프라인. 저장된 일정을 표시 중</div>
<section class="group" id="flights"></section>
<nav class="bar" id="bar">
  <div class="bar-title" id="bar-title"></div>
  <div class="seg" id="tabs" role="tablist" aria-label="날짜"><div class="seg-pill" id="pill"></div></div>
</nav>
<main id="day"></main>
<section id="extras"></section>
<button id="nowcap" type="button" aria-label="현재 일정으로 이동"><span class="a"></span><span class="go">이동</span><span class="b"></span></button>

<div class="sheet" id="map-sheet" aria-hidden="true">
  <div class="scrim" data-close></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="map-title">
    <div class="grab"></div>
    <div class="panel-head"><b id="map-title"></b><button class="btn" type="button" data-close>닫기</button></div>
    <div id="map-frame"></div>
  </div>
</div>

<div class="sheet" id="set-sheet" aria-hidden="true">
  <div class="scrim" data-close></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="set-title">
    <div class="grab"></div>
    <div class="panel-head"><b id="set-title">설정</b><button class="btn" type="button" data-close>완료</button></div>
    <div class="set">
      <div class="set-row">
        <span>인터랙션 효과<small>화면 전환, 등장 효과. 이 설정만 이 기기에 저장</small></span>
        <span class="switch"><input type="checkbox" id="motion-toggle" aria-label="인터랙션 효과"><span></span></span>
      </div>
    </div>
  </div>
</div>

<div class="sheet" id="rain-sheet" aria-hidden="true">
  <div class="scrim" data-close></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="rain-title">
    <div class="grab"></div>
    <div class="panel-head"><b id="rain-title">비 예보로 바뀐 일정</b><button class="btn" type="button" data-close>확인</button></div>
    <p class="rain-desc">오늘 일정은 그대로 두고, 내일 이후 일정만 바꿨습니다. 날짜를 누르면 바뀐 일정으로 이동합니다.</p>
    <div id="rain-body"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
(function () {
  'use strict';

  var MOTION_KEY = 'trip-motion';
  var PICK_KEY = 'trip-pick-v2';
  var EMBED = 'https://www.google.com/maps/embed/v1/';
  // Pages 재배포를 기다리지 않도록 저장소 원본 파일을 직접 읽음
  var WEATHER_URL = 'https://raw.githubusercontent.com/Aleph-Kim/travle-plan/main/data/weather.json';
  var RAIN_SEEN_KEY = 'trip-rain-seen';
  var plan = null;
  var weather = null;
  var current = 0;
  var io = null;

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'class') n.className = attrs[k];
      else if (k === 'html') n.innerHTML = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }

  // 사생활 보호 모드처럼 저장소가 막혀도 페이지는 동작해야 함
  function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  function motionOn() { return document.documentElement.classList.contains('motion'); }
  function applyMotion(on) {
    document.documentElement.classList.toggle('motion', on);
    document.getElementById('motion-toggle').checked = on;
  }

  function yen(n) { return n.toLocaleString('ko-KR'); }

  // 현지(일본) 시각 기준이어야 해외에서도 오늘 탭과 현재 일정이 맞음
  function jstNow() {
    var o = {};
    new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
      .formatToParts(new Date()).forEach(function (p) { o[p.type] = p.value; });
    return { date: o.year + '-' + o.month + '-' + o.day, min: +o.hour * 60 + +o.minute };
  }

  // 링크는 place_id 로 만들고, query 는 place_id 를 못 찾을 때만 쓰이는 대체값

  var CHECK = '<svg class="chk" viewBox="0 0 22 22"><circle cx="11" cy="11" r="10"/><path d="M6.5 11.2l3 3 6-6"/></svg>';

  function choiceCard(c, key) {
    var chosen = (load(PICK_KEY) || {})[key] || [];
    var card = el('div', { class: 'card' }, [head(c), el('div', { class: 'choice-tag' }, [c.title, el('span', { class: 'choice-hint', text: c.multi ? '여러 곳 체크 가능' : '하나 고르기' })])]);

    var box = el('div', { class: 'opts' + (c.multi ? ' multi' : '') + (chosen.length ? ' picked' : '') });

      var r = reviews(o); if (r) opt.appendChild(r);
      var a = o.pid ? acts(o.name, placeLink(o), placeEmbed(o.pid)) : null; if (a) opt.appendChild(a);

  // 러닝은 숙소에서 출발해 숙소로 돌아오는 순환이라 경유지를 waypoints 로 넘김
  function runCard(r) {
    var card = el('div', { class: 'card' }, [head(r), el('div', { class: 'title', text: r.name }), lines('tip', r.tip)]);

      var a = acts(r.label || m.name, dirLink(r.fromName, r.from, r.toName, r.to, r.mode), dirEmbed(r.from, r.to, r.mode));

  }

  function item(s, key) {

  function countUp(node, to) {

    var t0 = null;
    function step(t) {
      if (!t0) t0 = t;
      var k = Math.min(1, (t - t0) / 800);
      node.firstChild.nodeValue = yen(Math.round(to * (1 - Math.pow(1 - k, 3))));

  }

  // 애플 제품 페이지처럼 화면에 들어올 때 하나씩 떠오르는 등장 효과
  function reveal(root) {

    if (!motionOn() || !('IntersectionObserver' in window)) {
      Array.prototype.forEach.call(nodes, function (n) { n.classList.add('in'); });

  // 오늘 탭이면 이미 시작한 일정 중 가장 최근 것을 현재로, 그 전은 지난 일정으로 표시
  function markNow(scroll) {
    var now = jstNow();
    var day = plan.days[current];
    var rows = document.querySelectorAll('#day .it');
    var hit = -1;
    Array.prototype.forEach.call(rows, function (r, j) {
      r.classList.remove('now', 'past');
      var c = r.querySelector('.now-chip'); if (c) c.remove();
      var m = r.getAttribute('data-min');

    Array.prototype.forEach.call(rows, function (r, j) { if (j < hit) r.classList.add('past'); });
    var cur = rows[hit];

    cur.querySelector('.time').appendChild(el('span', { class: 'now-chip', text: '지금' }));

    var t = cur.querySelector('.choice-tag') || cur.querySelector('.title');

  // 오늘 이후 일정이 비 때문에 바뀌었으면 처음 볼 때 한 번 안내 (같은 변경은 다시 띄우지 않음)
  function rainModal() {
    var today = jstNow().date;
    var changed = plan.days.filter(function (d) { return d.date > today && isRainy(d); });
    if (!changed.length) return;
    var sig = changed.map(function (d) { return d.date; }).join(',');
    if (load(RAIN_SEEN_KEY) === sig) return;
    var box = document.getElementById('rain-body');
    box.textContent = '';
    changed.forEach(function (d) {
      var sk = d.stops.filter(function (s) { return s.rs; }).map(function (s) { return s.name; });
      var b = el('button', { class: 'rain-day', type: 'button' }, [
        el('b', { text: d.label + ' ' + d.title }),
        el('span', { text: sk.length ? '빠지는 일정: ' + sk.join(', ') : d.rain })
      ]);
      b.addEventListener('click', function () {
        closeSheet(document.getElementById('rain-sheet'));
        renderDay(plan.days.indexOf(d), 1);
        window.scrollTo(0, document.getElementById('bar').offsetTop);
      });
      box.appendChild(b);
    });
    save(RAIN_SEEN_KEY, sig);
    openSheet('rain-sheet');
  }

  // 브라우저가 이전 스크롤 위치를 복원하면 현재 일정으로 이동한 것이 덮어써짐
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

  var stored = load(MOTION_KEY);
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  applyMotion(stored == null ? !reduce : !!stored);
  document.getElementById('motion-toggle').addEventListener('change', function (e) {
    applyMotion(e.target.checked); save(MOTION_KEY, e.target.checked);
    if (plan) renderDay(current, 0, true);
  });
  document.getElementById('open-set').addEventListener('click', function () { openSheet('set-sheet'); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-close]'), function (n) {
    n.addEventListener('click', function () { closeSheet(n.closest('.sheet')); });
  });

  var bar = document.getElementById('bar');
  var ticking = false;
  window.addEventListener('scroll', function () {
    if (ticking) return; ticking = true;
    requestAnimationFrame(function () { bar.classList.toggle('stuck', bar.getBoundingClientRect().top <= 0); ticking = false; });
  }, { passive: true });
  window.addEventListener('resize', function () { if (plan) moveTabs(current); });

  function net() { document.getElementById('net').hidden = navigator.onLine; }
  window.addEventListener('online', net); window.addEventListener('offline', net); net();

  fetch('data/plan.json').then(function (r) { return r.json(); }).then(init).catch(function () {
    document.getElementById('day').textContent = '일정을 불러오지 못했습니다. 한 번 온라인 상태에서 열어 주세요.';
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
